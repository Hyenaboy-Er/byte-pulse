# Byte-Pulse Nightly mit Danny Williams — nächtliche Tech-News-Sendung.
#
# Baut jede Nacht aus den Top-Storys eine 16:9-Nachrichtensendung (Anchor
# Danny Williams + Story-Visuals + KI-Voiceover) und lädt sie direkt auf
# YouTube hoch (YouTube Data API). ffmpeg ist auf ubuntu-latest vorinstalliert.
#
# SECRETS (in GitHub bereits hinterlegt):
#     GROQ_API_KEY      — Skript (Llama 3.3 70B, Groq Free Tier)
#     OPENAI_API_KEY    — nur noch für KI-Metadaten-Optimierer (optional);
#                         wenn nicht gesetzt, fällt der Upload auf Klartext-
#                         Titel/Description zurück.
#     YT_CLIENT_ID / YT_CLIENT_SECRET / YT_REFRESH_TOKEN — YouTube-Upload
#   Optional als "Variable" (nicht Secret):
#     BROADCAST_STORIES = Anzahl Storys, default 8 (mehr = längere Sendung)
#     GROQ_MODEL        = default llama-3.3-70b-versatile

name: Byte-Pulse Nightly

on:
  schedule:
    # 02:30 UTC — nachts. Sendung steht am frühen Morgen bereit.
    - cron: '30 2 * * *'
  workflow_dispatch: {}

jobs:
  broadcast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install ffmpeg + ffprobe
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg

      - name: Install edge-tts (free Microsoft TTS, no auth)
        run: pip install --quiet edge-tts

      - name: Render nightly broadcast
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SITE_URL: 'https://www.byte-pulse.net'
          BROADCAST_STORIES: ${{ vars.BROADCAST_STORIES }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
        run: node scripts/news-broadcast.mjs

      - name: Upload broadcast (Backup-Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: byte-pulse-nightly
          path: out/broadcast/nightly.mp4
          retention-days: 14

      # Volle 16:9-Sendung direkt via YouTube Data API hochladen (Buffer kann
      # auf YouTube nur Shorts) — KI-optimierter Titel/Beschreibung/Tags.
      - name: Upload broadcast to YouTube
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
        run: node scripts/youtube-upload.mjs out/broadcast/nightly.mp4 out/broadcast/broadcast-meta.json
