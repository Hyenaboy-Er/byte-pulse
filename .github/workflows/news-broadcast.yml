# Byte-Pulse Nightly mit Danny Williams — nächtliche Tech-News-Sendung.
#
# Baut jede Nacht aus den Top-Storys eine 16:9-Nachrichtensendung (Anchor
# Danny Williams + Story-Visuals + KI-Voiceover) und legt sie als Artifact ab.
# ffmpeg ist auf ubuntu-latest vorinstalliert → kostenlos.
#
# EINMALIGES SETUP (du, in GitHub):
#   Repo → Settings → Secrets and variables → Actions → New repository secret
#     OPENAI_API_KEY  = (dein OpenAI-Key — Skript + TTS)
#   Optional als "Variable" (nicht Secret):
#     BROADCAST_STORIES = Anzahl Storys, default 8 (mehr = längere Sendung)
#     TTS_VOICE         = onyx (default) | echo | nova | …

name: Byte-Pulse Nightly

on:
  # Nächtlicher Lauf PAUSIERT, bis das Broadcast-Format entschieden ist:
  # Buffer kann auf YouTube nur Shorts posten (vertikal, <= 3 Min) — die
  # 16:9-Sendung wird abgelehnt. Bis zur Entscheidung kein Auto-Lauf, damit
  # keine OpenAI-Kosten für eine Sendung anfallen, die nicht gepostet wird.
  # schedule:
  #   - cron: '30 2 * * *'
  workflow_dispatch: {}

permissions:
  contents: write   # nötig, damit gh release create die Sendung hochladen darf

jobs:
  broadcast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install ffmpeg + ffprobe
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg

      - name: Render nightly broadcast
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SITE_URL: 'https://www.byte-pulse.net'
          BROADCAST_STORIES: ${{ vars.BROADCAST_STORIES }}
          TTS_VOICE: ${{ vars.TTS_VOICE }}
        run: node scripts/news-broadcast.mjs

      - name: Upload broadcast (Backup-Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: byte-pulse-nightly
          path: out/broadcast/nightly.mp4
          retention-days: 14

      - name: Publish to GitHub Release + auto-post to YouTube
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          TAG="nightly-$(date +%Y%m%d-%H%M%S)"
          gh release create "$TAG" out/broadcast/nightly.mp4 \
            --title "Byte-Pulse Nightly $TAG" \
            --notes "Auto-generated Byte-Pulse Nightly broadcast with Danny Williams."
          URL="https://github.com/${{ github.repository }}/releases/download/$TAG/nightly.mp4"
          echo "Public video URL: $URL"
          # 16:9-Sendung → nur YouTube (zu lang/breit für TikTok).
          node scripts/post-to-buffer.mjs "$URL" out/broadcast/broadcast-meta.json youtube
