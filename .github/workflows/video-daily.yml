# Tech-Highlight Video — kostenlos auf GitHub Actions.
#
# Erzeugt aus dem neuesten Artikel ein 9:16-Kurzvideo, veröffentlicht es als
# GitHub-Release (öffentliche URL) und postet es automatisch über Buffer in
# die TikTok-Queue. ffmpeg + gh + Node sind auf ubuntu-latest vorinstalliert.
#
# EINMALIGES SETUP (du, in GitHub → Settings → Secrets and variables → Actions):
#   OPENAI_API_KEY   = dein OpenAI-Key (Skript + TTS)
#   BUFFER_API_KEY   = dein Buffer-Key (Auto-Post zu TikTok)
#   Optional als Variable:
#     TTS_VOICE  = onyx (default) | echo | nova | …
#     MUSIC_URL  = direkte URL zu einem CC0-Musik-Bett (Pixabay), stereo
#
# Läuft 1×/Tag. Manuell auslösbar über "Run workflow".

name: Tech-Highlight Video

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch: {}

permissions:
  contents: write   # nötig, damit gh release create das Video hochladen darf

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install ffmpeg + ffprobe
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg

      - name: Render tech-highlight video
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SITE_URL: 'https://www.byte-pulse.net'
          TTS_VOICE: ${{ vars.TTS_VOICE }}
          MUSIC_URL: ${{ vars.MUSIC_URL }}
        run: node scripts/video-generator.mjs

      # Nur wenn der Generator wirklich ein neues Video erzeugt hat (gab es
      # keinen ungeposteten Artikel, fehlt out/highlight.mp4 → Schritt skippt).
      - name: Publish to GitHub Release + auto-post to TikTok & YouTube
        if: ${{ success() && hashFiles('out/highlight.mp4') != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          TAG="clip-$(date +%Y%m%d-%H%M%S)"
          gh release create "$TAG" out/highlight.mp4 \
            --title "Tech Highlight $TAG" \
            --notes "Auto-generated Byte-Pulse tech highlight."
          URL="https://github.com/${{ github.repository }}/releases/download/$TAG/highlight.mp4"
          echo "Public video URL: $URL"
          # 9:16-Kurzvideo → TikTok + YouTube (wird dort als Short eingestuft).
          node scripts/post-to-buffer.mjs "$URL" out/video-meta.json tiktok,youtube

      # Gepostete Artikel-URL festhalten, damit kein Duplikat entsteht.
      - name: Persist dedup state
        if: ${{ success() && hashFiles('out/highlight.mp4') != '' }}
        run: |
          git add data/posted-clips.json
          git -c user.name="byte-pulse-bot" \
              -c user.email="byte-pulse-bot@users.noreply.github.com" \
              commit -m "chore: record posted clip [skip ci]" || echo "nichts zu committen"
          git push || echo "push uebersprungen"
