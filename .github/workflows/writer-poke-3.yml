# Writer-Poke #3 — parallel cron queue (siehe writer-poke-2.yml für Rationale).
name: Writer Poke #3

on:
  schedule:
    # :15, :35, :55 jeder Stunde
    - cron: '15,35,55 * * * *'
  workflow_dispatch: {}

jobs:
  poke:
    runs-on: ubuntu-latest
    steps:
      - name: Fire /api/cron
        run: |
          POKE='pk_HxQ7nR9wYzVbpQc4mDjT3eK8aS6vG2fJ_writer_tick'
          curl -sS -m 60 "https://www.byte-pulse.net/api/cron?token=$POKE&batch=1" || true
