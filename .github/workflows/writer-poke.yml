# Writer-Poke — fires the pipeline. Quality-first since 2026-06-03:
# we do NOT chase a daily article-count target anymore. The publish
# decision is the Reviewer's originality + score gate; this cron just
# gives the pipeline a chance to try a new candidate.
#
# Single workflow (writer-poke-2/-3/-4 were removed — they existed to
# brute-force a ~48/day target which is no longer the goal). One cron,
# every 15 minutes, server-side cooldown enforces spacing.
#
# Missbrauch ist serverseitig abgefangen: /api/cron prüft den
# PUBLIC_POKE_MIN_GAP_MS-Cooldown und überspringt zu enge Pokes.

name: Writer Poke

on:
  schedule:
    # Every 15 minutes. Server-side cooldown PUBLIC_POKE_MIN_GAP_MS (15 min)
    # caps actual publishes — most ticks are no-ops by design because the
    # Reviewer rejects below quality threshold. That's working as intended.
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

jobs:
  poke:
    runs-on: ubuntu-latest
    steps:
      - name: Fire /api/cron
        run: |
          POKE='pk_HxQ7nR9wYzVbpQc4mDjT3eK8aS6vG2fJ_writer_tick'
          RESPONSE=$(curl -sS -w "\nHTTP_CODE:%{http_code}" "https://www.byte-pulse.net/api/cron?token=$POKE&batch=1")
          echo "$RESPONSE"
          CODE=$(echo "$RESPONSE" | grep -oE 'HTTP_CODE:[0-9]+' | cut -d: -f2)
          if [ "$CODE" = "200" ]; then
            echo "[poke] ok."
          else
            echo "::error::Writer-Endpoint antwortete mit HTTP $CODE"
            exit 1
          fi
