# Writer-Poke — feuert den Artikel-Writer alle 30 Min.
#
# Vercel Hobby erlaubt nur DAILY-Crons, deshalb läuft der Trigger hier auf
# GitHub Actions (keine Frequenz-Limits). Der /api/cron-Endpoint akzeptiert
# einen öffentlichen Poke-Token (im Code commitet) — kein Secret nötig.
#
# Missbrauch ist serverseitig abgefangen: /api/cron prüft, ob der letzte
# Artikel <20 Min alt ist und überspringt den Lauf in dem Fall. Egal wie
# oft jemand den Endpoint trifft, kann der Writer max. ~3 Artikel/Stunde
# schreiben.

name: Writer Poke

on:
  schedule:
    # Alle 10 Minuten. Server-Side enforced PUBLIC_POKE_MIN_GAP_MS=20min,
    # also wird trotzdem max 1 Artikel pro 20-Min-Fenster publiziert.
    # Häufigeres Pokeing = robuster gegen GitHub-Actions-Free-Tier-Drops
    # (Cron-Jobs werden bei Load gerne mal 30-90 Min skipped, also gleichen
    # wir mit höherer Frequenz aus). Effektiv ergibt das ~36-72 Artikel/Tag
    # Cap durch das 20-Min-Backoff, nicht den Cron.
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  poke:
    runs-on: ubuntu-latest
    steps:
      - name: Fire /api/cron
        run: |
          POKE='pk_HxQ7nR9wYzVbpQc4mDjT3eK8aS6vG2fJ_writer_tick'
          RESPONSE=$(curl -sS -w "\nHTTP_CODE:%{http_code}" "https://www.byte-pulse.net/api/cron?token=$POKE&batch=1")
          echo "$RESPONSE"
          CODE=$(echo "$RESPONSE" | grep -oE 'HTTP_CODE:[0-9]+' | cut -d: -f2)
          if [ "$CODE" = "200" ]; then
            echo "[poke] ok."
          else
            echo "::error::Writer-Endpoint antwortete mit HTTP $CODE"
            exit 1
          fi
